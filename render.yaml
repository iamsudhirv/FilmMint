# Render blueprint: Rails API + Postgres. The Vue frontend is deployed separately on Vercel.
databases:
  - name: filmmint-db
    databaseName: filmmint
    plan: free   # free Postgres on Render expires after ~30 days; upgrade for anything real

services:
  - type: web
    name: filmmint-api
    runtime: ruby
    plan: free
    buildCommand: bundle install
    # db:prepare creates + migrates, and seeds only when the database is brand new.
    startCommand: bin/rails db:prepare && bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: filmmint-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://filmmint.vercel.app

  # Vue frontend as a free static site (no Vercel needed).
  - type: web
    name: filmmint-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite   # single-page app: send every path to index.html
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # set to the filmmint-api URL, e.g. https://filmmint-api.onrender.com
